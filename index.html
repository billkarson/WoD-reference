<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>oWoD MET Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b08;
    --surface: #161310;
    --surface2: #1e1a15;
    --border: #2e2820;
    --border-glow: #5c3d1e;
    --gold: #c9973a;
    --gold-light: #e8b96a;
    --gold-dim: #7a5a22;
    --text: #d4c4a8;
    --text-dim: #7a6e5e;
    --text-bright: #f0e6cc;
    --larp-badge: #1a3a1a;
    --larp-text: #5aaf5a;
    --accent-green: #2a4a2a;
    --header-h: 64px;
    --nav-h: 52px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 16px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    border-bottom: 1px solid var(--border-glow);
    background: linear-gradient(180deg, #0a0806 0%, var(--surface) 100%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    z-index: 100;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .header-emblem {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(201,151,58,0.4);
    flex-shrink: 0;
  }

  .header-title h1 {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-title p {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-top: 1px;
  }

  /* hamburger — mobile only */
  #menuBtn {
    display: none;
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 18px;
    flex-shrink: 0;
  }

  /* ── DESKTOP LAYOUT ── */
  .app {
    position: fixed;
    top: var(--header-h);
    bottom: 0;
    left: 0; right: 0;
    display: grid;
    grid-template-columns: 260px 1fr;
    z-index: 1;
  }

  /* ── SIDEBAR ── */
  aside {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 16px 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-glow) transparent;
  }

  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 2px; }

  /* mobile: sidebar becomes a drawer */
  aside.drawer-closed { display: block; }

  .gameline-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 16px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    position: relative;
  }

  .gameline-btn:hover, .gameline-btn:active { color: var(--gold-light); background: rgba(201,151,58,0.06); }
  .gameline-btn.active { color: var(--gold-light); background: rgba(201,151,58,0.08); }
  .gameline-btn.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--gold);
  }

  .gameline-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .gameline-count {
    margin-left: auto;
    font-family: 'Crimson Text', serif;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chevron { transition: transform 0.2s; color: var(--text-dim); font-size: 11px; flex-shrink: 0; }
  .chevron.open { transform: rotate(90deg); }

  .sheet-list { display: none; padding: 2px 0 6px 0; }
  .sheet-list.open { display: block; }

  .sheet-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 16px 8px 34px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Crimson Text', serif;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    min-height: 40px; /* touch target */
  }

  .sheet-btn:hover, .sheet-btn:active { color: var(--text); background: rgba(255,255,255,0.03); }
  .sheet-btn.active { color: var(--gold-light); background: rgba(201,151,58,0.06); }

  .sheet-row-count { margin-left: auto; font-size: 11px; color: var(--text-dim); opacity: 0.7; flex-shrink: 0; }

  /* ── MAIN ── */
  main {
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-glow) transparent;
  }

  main::-webkit-scrollbar { width: 4px; }
  main::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 2px; }

  /* ── SEARCH BAR ── */
  .search-bar { display: flex; flex-direction: column; gap: 8px; }

  .search-wrap { position: relative; }

  .search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim); font-size: 16px; pointer-events: none;
  }

  #searchInput {
    width: 100%;
    padding: 12px 14px 12px 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-bright);
    font-family: 'Crimson Text', serif;
    font-size: 16px; /* prevents iOS zoom */
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  #searchInput:focus { border-color: var(--gold-dim); }
  #searchInput::placeholder { color: var(--text-dim); }

  .filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .filter-label {
    font-size: 11px; color: var(--text-dim);
    font-family: 'Cinzel', serif; letter-spacing: 0.05em; text-transform: uppercase;
  }

  .toggle-btn {
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: 'Crimson Text', serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 40px;
  }

  .toggle-btn.active { background: var(--larp-badge); border-color: var(--larp-text); color: var(--larp-text); }

  /* ── CONTENT HEADER ── */
  .content-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    flex-wrap: wrap;
  }

  .content-title {
    font-family: 'Cinzel', serif;
    font-size: 16px; font-weight: 600;
    color: var(--text-bright); letter-spacing: 0.05em;
  }

  .content-subtitle { font-size: 13px; color: var(--text-dim); }
  .result-count { margin-left: auto; font-size: 13px; color: var(--text-dim); }

  /* ── TABLE ── */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    -webkit-overflow-scrolling: touch;
  }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }

  thead { position: sticky; top: 0; z-index: 5; }

  th {
    background: var(--surface2);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border-glow);
    white-space: nowrap;
    font-weight: 600;
  }

  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
    line-height: 1.4;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(201,151,58,0.04); }

  td.primary-col { color: var(--text-bright); font-weight: 600; }
  td.page-col { color: var(--gold-dim); font-family: 'Cinzel', serif; font-size: 12px; white-space: nowrap; }
  td.book-col { color: var(--text-dim); font-size: 13px; font-style: italic; }

  /* ── MOBILE: card view for narrow screens ── */
  .card-list { display: flex; flex-direction: column; gap: 8px; }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .entry-card-name {
    font-family: 'Crimson Text', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-bright);
    line-height: 1.3;
  }

  .entry-card-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 2px;
  }

  .entry-card-book { font-size: 13px; color: var(--text-dim); font-style: italic; }
  .entry-card-page { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold-dim); }

  .entry-card-extras {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .entry-tag {
    font-size: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 7px;
    color: var(--text-dim);
  }

  /* LARP badge */
  .larp-badge {
    display: inline-block;
    background: var(--larp-badge);
    color: var(--larp-text);
    border: 1px solid var(--accent-green);
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    vertical-align: middle;
  }

  /* ── GLOBAL SEARCH ── */
  .global-result-group { margin-bottom: 20px; }

  .global-group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
    cursor: pointer;
    flex-wrap: wrap;
  }

  .global-group-header h3 {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .gameline-tag {
    font-size: 10px; color: var(--text-dim);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 10px;
    font-family: 'Cinzel', serif; letter-spacing: 0.05em;
  }

  .global-group-count { margin-left: auto; font-size: 12px; color: var(--text-dim); }

  /* ── EMPTY / WELCOME ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-icon { font-size: 40px; margin-bottom: 14px; opacity: 0.4; }
  .empty-state h3 { font-family: 'Cinzel', serif; font-size: 15px; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 0.08em; }

  .welcome { max-width: 560px; margin: 40px auto; text-align: center; }
  .welcome-symbol { font-size: 40px; color: var(--gold-dim); margin-bottom: 20px; opacity: 0.6; }
  .welcome h2 { font-family: 'Cinzel', serif; font-size: 17px; color: var(--text-bright); margin-bottom: 10px; letter-spacing: 0.07em; }
  .welcome p { color: var(--text-dim); line-height: 1.6; font-size: 15px; }

  .welcome-stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
  .stat-box { text-align: center; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; min-width: 100px; }
  .stat-num { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold); display: block; }
  .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.05em; text-transform: uppercase; }

  mark { background: rgba(201,151,58,0.25); color: var(--gold-light); border-radius: 2px; padding: 0 1px; }
  /* ── OWBN LEVELS ── */
  .levels-block { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
  .level-entry { border-left: 2px solid var(--border-glow); padding: 3px 0 3px 10px; }
  .level-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .level-dot { font-family: 'Cinzel', serif; color: var(--gold); font-size: 11px; flex-shrink: 0; letter-spacing: 2px; min-width: 52px; }
  .level-name { font-family: 'Crimson Text', serif; font-size: 14px; font-weight: 600; color: var(--text-bright); }
  .level-desc { font-size: 13px; color: var(--text); line-height: 1.5; }

  /* ── MOBILE OVERLAY ── */
  #drawerOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 90;
    pointer-events: none;
  }
  #drawerOverlay.open { display: block; }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 200; gap: 16px;
  }

  .load-title { font-family: 'Cinzel', serif; font-size: 17px; color: var(--gold); letter-spacing: 0.1em; }
  .load-bar { width: 180px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .load-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); animation: loadpulse 1.5s ease-in-out infinite; }

  @keyframes loadpulse {
    0%   { width: 0%;   margin-left: 0; }
    50%  { width: 60%;  margin-left: 20%; }
    100% { width: 0%;   margin-left: 100%; }
  }

  .hidden { display: none !important; }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    :root { --header-h: 56px; }

    #menuBtn { display: flex; align-items: center; justify-content: center; }

    .app { grid-template-columns: 1fr; }

    aside {
      position: fixed;
      top: var(--header-h); bottom: 0; left: 0;
      width: 280px;
      z-index: 95;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      padding-bottom: 32px;
    }

    aside.open {
      transform: translateX(0);
    }

    /* drawerOverlay.open defined above */

    main { padding: 12px; gap: 12px; }

    .header-title p { display: none; }
    .header-title h1 { font-size: 13px; }

    /* welcome breadcrumb in header when sheet is active */
    .active-sheet-label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 1px;
    }
  }

  @media (min-width: 701px) {
    .active-sheet-label { display: none; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="load-title">oWoD MET Index</div>
  <div class="load-bar"><div class="load-bar-fill"></div></div>
  <div style="font-size:13px;color:var(--text-dim)">Loading chronicles…</div>
</div>

<div id="drawerOverlay"></div>

<header>
  <div class="header-emblem">✦</div>
  <div class="header-title">
    <h1>oWoD MET Index</h1>
    <p>Mind's Eye Theatre Reference — All Gamelines</p>
    <span id="activeSheetLabel" class="active-sheet-label"></span>
  </div>
  <button id="menuBtn" onclick="toggleDrawer()" aria-label="Menu">☰</button>
</header>

<div class="app">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script>
// ── STATE ──
let DATA = null;
let isMobile = () => window.innerWidth <= 700;

let state = {
  activeGameline: null,
  activeSheet: null,
  search: '',
  larpOnly: false,
  openGamelines: new Set(),
};

const GAMELINE_COLORS = {
  'General':'#888','Vampire':'#8b1a1a','Kuei-jin':'#a0522d',
  'Mortals':'#4a6a8a','Changeling':'#6a4a8a','Mage':'#1a4a6a',
  'Werewolf':'#3a5a2a','Wraith':'#4a4a4a','Mummy':'#7a6a2a',
  'Inquisition':'#6a3a1a','Mage: Dark Ages':'#5a4a3a','Demon':'#5a1a5a','Hunter':'#2a4a5a',
};

// ── DRAWER ──────────────────────────────────────────────────────────────────
// The overlay sits behind the sidebar (z-index 90 vs 95) but iOS still fires
// touchend on it before the button click. Fix: give overlay pointer-events:none
// in CSS, and close via a document listener that guards on sidebar.contains().
function toggleDrawer() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawerOverlay');
  const opening = !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', opening);
  overlay.classList.toggle('open', opening);
  if (opening) {
    // 50ms delay so this tap doesn't immediately close the drawer
    setTimeout(function() {
      document.addEventListener('touchstart', _drawerClose, {capture:true, once:true, passive:true});
      document.addEventListener('click',      _drawerClose, {capture:true, once:true});
    }, 50);
  }
}

function _drawerClose(e) {
  if (!document.getElementById('sidebar').contains(e.target)) {
    closeDrawer();
  } else if (document.getElementById('sidebar').classList.contains('open')) {
    // re-arm so the next outside tap still closes
    setTimeout(function() {
      document.addEventListener('touchstart', _drawerClose, {capture:true, once:true, passive:true});
      document.addEventListener('click',      _drawerClose, {capture:true, once:true});
    }, 50);
  }
}

function closeDrawer() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

// ── LOAD ────────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('data.json');
    DATA = await res.json();
    document.getElementById('loading').classList.add('hidden');
    buildSidebar();
    renderMain();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '<div class="load-title" style="color:#c0392b">Failed to load data.json</div>' +
      '<p style="color:var(--text-dim);font-size:14px;margin-top:12px;padding:0 24px;text-align:center">Make sure data.json is in the same folder as index.html</p>';
  }
}

// ── SIDEBAR ─────────────────────────────────────────────────────────────────
// Use data-attributes + event delegation so gameline names with quotes/apostrophes
// never break onclick strings.
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  for (const gl of DATA.gamelines) {
    const sheets   = Object.entries(DATA.sheets).filter(([,s]) => s.gameline === gl);
    const total    = sheets.reduce((a,[,s]) => a + s.rows.length, 0);
    const color    = GAMELINE_COLORS[gl] || '#888';
    const isOpen   = state.openGamelines.has(gl);
    const isActive = state.activeGameline === gl;

    html += '<div class="sidebar-section">' +
      '<button class="gameline-btn ' + (isActive?'active':'') + '" data-gl="' + escAttr(gl) + '">' +
        '<span class="gameline-dot" style="background:' + color + '"></span>' +
        escH(gl) +
        '<span class="gameline-count">' + total.toLocaleString() + '</span>' +
        '<span class="chevron ' + (isOpen?'open':'') + '">›</span>' +
      '</button>' +
      '<div class="sheet-list ' + (isOpen?'open':'') + '">';

    for (const [name, sheet] of sheets) {
      html += '<button class="sheet-btn ' + (state.activeSheet===name?'active':'') + '" ' +
        'data-sheet="' + escAttr(name) + '" data-gl="' + escAttr(gl) + '">' +
        escH(name) +
        '<span class="sheet-row-count">' + sheet.rows.length.toLocaleString() + '</span>' +
      '</button>';
    }
    html += '</div></div>';
  }
  sidebar.innerHTML = html;
}

// Single delegated listener on the sidebar — works perfectly on mobile because
// there is no overlay interference at all.
document.addEventListener('click', function(e) {
  const glBtn    = e.target.closest('.gameline-btn');
  const sheetBtn = e.target.closest('.sheet-btn');
  if (glBtn)    { e.stopPropagation(); toggleGameline(glBtn.dataset.gl); }
  if (sheetBtn) { e.stopPropagation(); selectSheet(sheetBtn.dataset.sheet, sheetBtn.dataset.gl); }
});

function toggleGameline(gl) {
  if (state.openGamelines.has(gl)) state.openGamelines.delete(gl);
  else state.openGamelines.add(gl);
  state.activeGameline = gl;
  state.activeSheet    = null;
  buildSidebar();
  renderMain();
}

function selectSheet(name, gl) {
  state.activeSheet    = name;
  state.activeGameline = gl;
  state.search         = '';
  state.openGamelines.add(gl);
  // Clear the search input value without rebuilding it
  var inp = document.getElementById('searchInput');
  if (inp) inp.value = '';
  buildSidebar();
  renderMain();
  var lbl = document.getElementById('activeSheetLabel');
  if (lbl) lbl.textContent = name;
  if (isMobile()) closeDrawer();
}

// ── RENDER ───────────────────────────────────────────────────────────────────
// KEY FIX for search: the search input is inside a container div (#searchSticky)
// that we NEVER replace with innerHTML. We only replace #mainResults.
// This means iOS never destroys and recreates the <input>, so the keyboard stays.

function renderMain() {
  var q       = state.search.trim().toLowerCase();
  var sticky  = document.getElementById('searchSticky');
  var results = document.getElementById('mainResults');

  if (!sticky || !results) {
    // First render — need to build the scaffold
    var main = document.getElementById('main');
    main.innerHTML =
      '<div id="searchSticky"></div>' +
      '<div id="mainResults"></div>';
    sticky  = document.getElementById('searchSticky');
    results = document.getElementById('mainResults');
  }

  if (!state.activeSheet) {
    // No sheet selected: hide the sheet-specific search bar, show welcome/global
    sticky.innerHTML = '';
    if (q.length >= 2) {
      results.innerHTML = buildGlobalSearchHTML(q);
    } else {
      results.innerHTML = buildWelcomeHTML();
    }
    return;
  }

  // Sheet is active: show persistent search bar (only rebuild if sheet changed)
  var sheet = DATA.sheets[state.activeSheet];
  if (!sheet) return;

  // Only rebuild the sticky bar if the sheet changed (avoids destroying the input)
  if (sticky.dataset.sheet !== state.activeSheet) {
    sticky.dataset.sheet = state.activeSheet;
    sticky.innerHTML =
      '<div class="search-bar">' +
        '<div class="search-wrap">' +
          '<span class="search-icon">⌕</span>' +
          '<input id="searchInput" type="search" inputmode="search" ' +
            'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ' +
            'placeholder="Search ' + escAttr(state.activeSheet) + '…" ' +
            'oninput="onSearch(this.value)">' +
        '</div>' +
        '<div id="filterRow" class="filter-row"></div>' +
      '</div>';
  }

  // Always update the filter row (larpOnly state may have changed)
  var filterRow = document.getElementById('filterRow');
  if (filterRow) {
    filterRow.innerHTML =
      '<span class="filter-label">Filter:</span>' +
      (sheet.hasLarp ? '<button class="toggle-btn ' + (state.larpOnly?'active':'') + '" onclick="toggleLarp()">✦ LARP Only</button>' : '') +
      '<button class="toggle-btn" onclick="goBack()">← All</button>';
  }

  // Filter rows
  var rows = sheet.rows;
  if (state.larpOnly && sheet.hasLarp) {
    rows = rows.filter(function(r) { var v = r['Larp Version']; return v && String(v).trim().toUpperCase()==='Y'; });
  }
  if (q) {
    rows = rows.filter(function(r) { return Object.values(r).some(function(v) { return v && String(v).toLowerCase().includes(q); }); });
  }

  var cols = sheet.columns;
  var html = '<div class="content-header">' +
    '<div>' +
      '<div class="content-title">' + escH(state.activeSheet) + '</div>' +
      '<div class="content-subtitle">' + escH(state.activeGameline) + '</div>' +
    '</div>' +
    '<div class="result-count">' + rows.length.toLocaleString() + ' entries</div>' +
  '</div>';

  if (rows.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">⊘</div><h3>No Results Found</h3><p>Try adjusting your search.</p></div>';
  } else if (isMobile()) {
    html += renderCards(rows, cols, q);
  } else {
    html += renderTable(rows, cols, q, null);
  }

  results.innerHTML = html;
}

function goBack() {
  state.activeSheet = null;
  state.search      = '';
  buildSidebar();
  renderMain();
}

function buildWelcomeHTML() {
  var totalRows   = Object.values(DATA.sheets).reduce(function(a,s){ return a+s.rows.length; }, 0);
  var totalSheets = Object.keys(DATA.sheets).length;
  return '<div class="welcome">' +
    '<div class="welcome-symbol">✦</div>' +
    '<h2>Old World of Darkness — MET Index</h2>' +
    '<p>' + (isMobile() ? 'Tap ☰ to browse by gameline, or search above.' : 'Select a gameline from the sidebar, or search above.') + '</p>' +
    '<div class="welcome-stats">' +
      '<div class="stat-box"><span class="stat-num">' + totalRows.toLocaleString() + '</span><div class="stat-label">Entries</div></div>' +
      '<div class="stat-box"><span class="stat-num">' + totalSheets + '</span><div class="stat-label">Categories</div></div>' +
      '<div class="stat-box"><span class="stat-num">' + DATA.gamelines.length + '</span><div class="stat-label">Gamelines</div></div>' +
      '<div class="stat-box"><span class="stat-num">' + DATA.books.length + '</span><div class="stat-label">Books</div></div>' +
    '</div>' +
  '</div>';
}

function buildGlobalSearchHTML(q) {
  var results = [];
  for (var entry of Object.entries(DATA.sheets)) {
    var name  = entry[0];
    var sheet = entry[1];
    var rows  = sheet.rows.filter(function(r){ return Object.values(r).some(function(v){ return v && String(v).toLowerCase().includes(q); }); });
    if (state.larpOnly && sheet.hasLarp)
      rows = rows.filter(function(r){ var v=r['Larp Version']; return v && String(v).trim().toUpperCase()==='Y'; });
    if (rows.length) results.push({name:name, sheet:sheet, rows:rows});
  }
  var totalHits = results.reduce(function(a,r){ return a+r.rows.length; }, 0);

  var html = '<div class="content-header">' +
    '<div class="content-title">Search: "' + escH(state.search) + '"</div>' +
    '<div class="result-count">' + totalHits.toLocaleString() + ' in ' + results.length + ' categories</div>' +
  '</div>';

  if (!results.length) {
    html += '<div class="empty-state"><div class="empty-icon">⊘</div><h3>No Results Found</h3></div>';
  } else {
    for (var r of results) {
      var gl   = r.sheet.gameline;
      var cols = r.sheet.columns;
      html += '<div class="global-result-group">' +
        '<div class="global-group-header" ' +
          'data-sheet="' + escAttr(r.name) + '" data-gl="' + escAttr(gl) + '" ' +
          'onclick="selectSheet(this.dataset.sheet,this.dataset.gl)">' +
          '<span class="gameline-dot" style="background:' + (GAMELINE_COLORS[gl]||'#888') + ';width:8px;height:8px;border-radius:50%;display:inline-block"></span>' +
          '<h3>' + escH(r.name) + '</h3>' +
          '<span class="gameline-tag">' + escH(gl) + '</span>' +
          '<span class="global-group-count">' + r.rows.length + ' match' + (r.rows.length!==1?'es':'') + '</span>' +
        '</div>';
      var shown = r.rows.slice(0,50);
      html += isMobile() ? renderCards(shown, cols, q) : renderTable(shown, cols, q, 240);
      html += '</div>';
    }
  }
  return html;
}

// ── OWBN LEVELS RENDERER ─────────────────────────────────────────────────────
var DOTS = ['','•','••','•••','••••','•••••'];

function renderLevels(levelsJson) {
  if (!levelsJson) return '';
  var levels;
  try { levels = JSON.parse(levelsJson); } catch(e) { return ''; }
  if (!levels || !levels.length) return '';
  var h = '<div class="levels-block">';
  for (var lv of levels) {
    var dot = (lv.Level >= 1 && lv.Level <= 5) ? DOTS[lv.Level] : String(lv.Level);
    h += '<div class="level-entry">' +
      '<div class="level-header">' +
        '<span class="level-dot">' + escH(dot) + '</span>' +
        '<span class="level-name">' + escH(lv.Name || '') + '</span>' +
      '</div>' +
      (lv.Description ? '<div class="level-desc">' + escH(lv.Description) + '</div>' : '') +
    '</div>';
  }
  return h + '</div>';
}

// ── TABLE (desktop) ───────────────────────────────────────────────────────────
function renderTable(rows, cols, q, maxH) {
  var hasLevels = cols.includes('Levels');
  var dcols = (maxH ? cols.slice(0,5) : cols).filter(function(c){ return c !== 'Levels'; });
  var style = maxH ? 'style="max-height:' + maxH + 'px"' : '';
  var h = '<div class="table-wrap" ' + style + '><table><thead><tr>';
  for (var c of dcols) h += '<th>' + escH(c) + '</th>';
  h += '</tr></thead><tbody>';
  for (var row of rows) {
    h += '<tr>';
    for (var i=0; i<dcols.length; i++) {
      var col = dcols[i]; var val = row[col]; var d = val==null?'':String(val);
      if (col==='Larp Version') {
        h += '<td>' + (d.trim().toUpperCase()==='Y' ? '<span class="larp-badge">LARP</span>' : '') + '</td>';
      } else if (i===0) {
        h += '<td class="primary-col">' + hl(d,q) + '</td>';
      } else if (col==='Page'||col==='Page Number'||col==='Page.1') {
        h += '<td class="page-col">' + escH(d) + '</td>';
      } else if (col==='Book') {
        h += '<td class="book-col">' + hl(d,q) + '</td>';
      } else {
        h += '<td>' + hl(d,q) + '</td>';
      }
    }
    h += '</tr>';
    if (hasLevels && row['Levels']) {
      var lh = renderLevels(row['Levels']);
      if (lh) h += '<tr class="levels-row"><td colspan="' + dcols.length + '" style="padding:4px 12px 14px 24px;border-bottom:1px solid var(--border)">' + lh + '</td></tr>';
    }
  }
  return h + '</tbody></table></div>';
}

// ── CARDS (mobile) ────────────────────────────────────────────────────────────
function renderCards(rows, cols, q) {
  var nameCol   = cols[0];
  var bookCol   = cols.find(function(c){ return c==='Book'; });
  var pageCol   = cols.find(function(c){ return c==='Page'||c==='Page Number'||c==='Page.1'; });
  var larpCol   = cols.find(function(c){ return c==='Larp Version'; });
  var levelsCol = cols.find(function(c){ return c==='Levels'; });
  var descCol   = cols.find(function(c){ return c==='Description'; });
  var extraCols = cols.filter(function(c){ return c!==nameCol&&c!==bookCol&&c!==pageCol&&c!==larpCol&&c!=='Page.1'&&c!=='Levels'&&c!=='Description'; });

  var h = '<div class="card-list">';
  for (var row of rows) {
    var name   = row[nameCol]==null?'':String(row[nameCol]);
    var book   = bookCol  && row[bookCol]  ? String(row[bookCol])  : '';
    var page   = pageCol  && row[pageCol]  ? String(row[pageCol])  : '';
    var isLarp = larpCol  && String(row[larpCol]||'').trim().toUpperCase()==='Y';

    h += '<div class="entry-card">';
    h += '<div class="entry-card-name">' + hl(name,q) + (isLarp?' <span class="larp-badge">LARP</span>':'') + '</div>';

    if (book || page) {
      h += '<div class="entry-card-meta">';
      if (book) h += '<span class="entry-card-book">' + hl(book,q) + '</span>';
      if (page) h += '<span class="entry-card-page">p.' + escH(page) + '</span>';
      h += '</div>';
    }

    if (descCol && row[descCol]) {
      h += '<div class="level-desc" style="margin-top:5px;font-size:13px">' + escH(String(row[descCol])) + '</div>';
    }

    var extras = extraCols.filter(function(c){ return row[c]!=null && String(row[c]).trim()!==''; });
    if (extras.length) {
      h += '<div class="entry-card-extras">';
      for (var c of extras.slice(0,4)) h += '<span class="entry-tag">' + escH(c) + ': ' + hl(String(row[c]),q) + '</span>';
      h += '</div>';
    }

    if (levelsCol && row[levelsCol]) h += renderLevels(row[levelsCol]);

    h += '</div>';
  }
  return h + '</div>';
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function hl(text, q) {
  if (!q||!text) return escH(text);
  var safe  = escH(text);
  var safeQ = escH(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp('(' + safeQ + ')','gi'),'<mark>$1</mark>');
}

function escH(str) {
  if (str==null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(str) {
  if (str==null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

var _searchTimer;
function onSearch(val) {
  state.search = val;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(renderMain, 220);
}

function toggleLarp() { state.larpOnly = !state.larpOnly; renderMain(); }

window.addEventListener('resize', function() {
  if (!isMobile()) closeDrawer();
  renderMain();
});

loadData();
</script>
</body>
